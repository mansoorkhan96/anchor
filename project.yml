name: Anchor
options:
  bundleIdPrefix: dev.mansoor
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Anchor:
    type: application
    platform: macOS
    sources:
      - path: Anchor
    dependencies:
      - target: AnchorSafariExtension
        embed: true
      - target: AnchorNativeHost
        embed: true
        copy:
          destination: executables
    info:
      path: Anchor/Resources/Info.plist
      properties:
        CFBundleDisplayName: Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: Anchor asks System Events to shut down your Mac when you choose "Shut Down" after downloads finish.
        CFBundleURLTypes:
          - CFBundleURLName: Magnet link
            CFBundleURLSchemes: [magnet]
          - CFBundleURLName: Anchor
            CFBundleURLSchemes: [anchor]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mansoor.Anchor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Embed aria2
        script: "\"${PROJECT_DIR}/scripts/embed-aria2.sh\""
        basedOnDependencyAnalysis: false
  AnchorSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
        excludes: ["Resources/**"]
      - path: SafariExtension/Resources
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Anchor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mansoor.Anchor.SafariExtension
        GENERATE_INFOPLIST_FILE: NO
  AnchorNativeHost:
    type: tool
    platform: macOS
    sources: [AnchorNativeHost]
    settings:
      base:
        PRODUCT_NAME: anchor-native-host
        PRODUCT_BUNDLE_IDENTIFIER: dev.mansoor.Anchor.NativeHost
        SKIP_INSTALL: YES
  AnchorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AnchorTests]
    dependencies:
      - target: Anchor
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Anchor.app/Contents/MacOS/Anchor
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Anchor:
    build:
      targets:
        Anchor: all
        AnchorTests: [test]
    test:
      targets: [AnchorTests]
