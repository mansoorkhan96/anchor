<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; width: 240px; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; background: #17181C; color: #ECEDEF; }
  main { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 14px; font-weight: 650; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9A9DA6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #F2B35B; }
  .dot.on { background: #6FD3A0; }
  label { display: flex; align-items: center; gap: 8px; }
  input { accent-color: #5CCDEB; }
</style>
</head>
<body>
<main>
  <h1>Drift</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Checking…</span></div>
  <label><input type="checkbox" id="enabled"> Send downloads to Drift</label>
</main>
<script src="popup.js"></script>
</body>
</html>
